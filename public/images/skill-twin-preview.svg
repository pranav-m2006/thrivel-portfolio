<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="100%" stop-color="#0E121E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid -->
  <g opacity="0.1" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/>
    <line x1="1000" y1="0" x2="1000" y2="700"/>
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="40" y="40" width="1120" height="64" rx="10" fill="#0D111A" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="76" cy="72" r="7" fill="#EF4444"/>
  <circle cx="102" cy="72" r="7" fill="#F59E0B"/>
  <circle cx="128" cy="72" r="7" fill="#10B981"/>
  <text x="170" y="78" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">AI SKILL TWIN</text>
  <text x="310" y="77" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">/ Career Intelligence &amp; Gap Assessment</text>
  
  <rect x="920" y="54" width="210" height="36" rx="6" fill="#161F30" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="940" cy="72" r="4" fill="#00F0FF"/>
  <text x="955" y="76" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F0FF">Gemini AI Engine: Active</text>

  <!-- Left Card: Candidate Skill Radar & Assessment -->
  <rect x="40" y="128" width="530" height="520" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="76" y="174" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#00F0FF">01 // CANDIDATE COMPETENCY MATRIX</text>
  <text x="76" y="210" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Skill Profile &amp; Gap Analysis</text>
  <text x="76" y="238" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">Target: Full-Stack React &amp; AI Systems Engineer</text>

  <!-- Skill Bars -->
  <g transform="translate(76, 275)">
    <!-- Skill 1 -->
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">React &amp; Modern Frontend Architecture</text>
    <text x="380" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00F0FF">88% Verified</text>
    <rect x="0" y="10" width="450" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="10" width="396" height="8" rx="4" fill="url(#cyanGrad)"/>

    <!-- Skill 2 -->
    <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">TypeScript &amp; Type Safety Systems</text>
    <text x="380" y="55" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00F0FF">82% Verified</text>
    <rect x="0" y="65" width="450" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="65" width="369" height="8" rx="4" fill="url(#cyanGrad)"/>

    <!-- Skill 3 -->
    <text x="0" y="110" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Machine Learning &amp; Scikit-learn</text>
    <text x="380" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8B5CF6">78% Verified</text>
    <rect x="0" y="120" width="450" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="120" width="351" height="8" rx="4" fill="url(#violetGrad)"/>

    <!-- Skill 4 -->
    <text x="0" y="165" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Gemini API &amp; LLM Orchestration</text>
    <text x="380" y="165" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8B5CF6">85% Verified</text>
    <rect x="0" y="175" width="450" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="175" width="382" height="8" rx="4" fill="url(#violetGrad)"/>

    <!-- Skill Gap Indicator Box -->
    <rect x="0" y="215" width="450" height="80" rx="10" fill="#0B1320" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="245" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F0FF">DETECTED COMPETENCY GAP:</text>
    <text x="20" y="272" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Advanced Micro-frontend Architecture (Recommended Next)</text>
  </g>

  <!-- Right Card: Phased Milestone Roadmap -->
  <rect x="630" y="128" width="530" height="520" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="666" y="174" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8B5CF6">02 // CAREER ROADMAP SYNTHESIS</text>
  <text x="666" y="210" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Adaptive Milestone Roadmap</text>
  <text x="666" y="238" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">AI-Synthesized Phased Learning Progression</text>

  <!-- Roadmap Timeline -->
  <g transform="translate(666, 275)">
    <!-- Milestone 1 -->
    <circle cx="16" cy="16" r="16" fill="#00F0FF"/>
    <text x="16" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#07080B" text-anchor="middle">01</text>
    <text x="48" y="14" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Component System Refactoring</text>
    <text x="48" y="32" font-family="-apple-system, sans-serif" font-size="13" fill="#10B981">✓ Completed &amp; Benchmarked</text>
    <line x1="16" y1="36" x2="16" y2="80" stroke="#1E293B" stroke-width="2"/>

    <!-- Milestone 2 -->
    <circle cx="16" cy="96" r="16" fill="#8B5CF6"/>
    <text x="16" y="101" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="48" y="94" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Gemini API Resume Extraction Flow</text>
    <text x="48" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#00F0FF">● Active Sprint (85% Ready)</text>
    <line x1="16" y1="116" x2="16" y2="160" stroke="#1E293B" stroke-width="2"/>

    <!-- Milestone 3 -->
    <circle cx="16" cy="176" r="16" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <text x="16" y="181" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">03</text>
    <text x="48" y="174" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Full-Stack CI/CD Edge Deployment</text>
    <text x="48" y="192" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">Upcoming Target</text>

    <!-- Bottom Metric Card -->
    <rect x="0" y="235" width="450" height="60" rx="10" fill="#111B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="270" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Candidate Job-Readiness Score</text>
    <text x="380" y="271" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#00F0FF">84/100</text>
  </g>
</svg>
